# Push a tag that equals manifest.json's version (e.g. 0.1.0, no "v") to publish a release.
# BRAT and Obsidian's community store install from the release assets: main.js, manifest.json, styles.css.
name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != manifest version $v"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --generate-notes
          fi
